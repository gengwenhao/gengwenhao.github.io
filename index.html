<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillRunner - AI 技能执行工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #1d1d1f;
      background: #f5f5f7;
      line-height: 1.6;
    }
    .hero {
      text-align: center;
      padding: 100px 20px 60px;
      background: linear-gradient(180deg, #fff 0%, #f5f5f7 100%);
    }
    .hero h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #1d1d1f 0%, #636366 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero .subtitle {
      font-size: 20px;
      color: #86868b;
      margin-bottom: 36px;
    }
    .badge {
      display: inline-block;
      background: #1d1d1f;
      color: #fff;
      padding: 14px 36px;
      border-radius: 32px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      transition: all .2s;
    }
    .badge:hover { transform: scale(1.04); }
    .features {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 32px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .card .icon { font-size: 40px; margin-bottom: 16px; }
    .card h3 { font-size: 18px; margin-bottom: 8px; }
    .card p { font-size: 14px; color: #86868b; }
    .footer {
      text-align: center;
      padding: 40px 20px;
      font-size: 13px;
      color: #86868b;
      border-top: 1px solid #e5e5e5;
    }
    .footer a { color: #0071e3; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>SkillRunner</h1>
    <p class="subtitle">扫码即连 · 点卡片执行 · AI 自动出结果</p>
    <a href="#" class="badge">📱 即将上架 App Store</a>
  </div>

  <div class="features">
    <div class="card">
      <div class="icon">📋</div>
      <h3>任务卡片</h3>
      <p>点一下，AI 自动执行。不用手写命令，不用懂技术。</p>
    </div>
    <div class="card">
      <div class="icon">📱</div>
      <h3>扫码即连</h3>
      <p>扫二维码自动配置，零门槛上手。</p>
    </div>
    <div class="card">
      <div class="icon">🤖</div>
      <h3>AI 驱动</h3>
      <p>英语学习 · 知识问答 · 市场调研 · 更多场景</p>
    </div>
  </div>

  <div class="footer">
    <a href="/privacy.html">隐私政策</a> &nbsp;·&nbsp;
    <a href="mailto:gengwenhao97@126.com">联系我们</a>
    <p style="margin-top:8px;">© 2026 SkillRunner</p>
  </div>
</body>
</html>
